<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aeonic Odyssey: Book 2 — Grail of Betrayal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="stage" id="stage">
  <div class="book" id="book">
    <div class="spine"></div>
    <button class="cover" id="cover" aria-label="Open the book">
      <img class="cover-art" id="cover-art" src="assets/cover-placeholder.svg" alt="Book cover">
      <span class="tap-hint">Tap the cover to open</span>
    </button>
  </div>
</div>

<main class="library" id="library" hidden>
  <h1 class="book-title" id="book-title">Aeonic Odyssey: Book 2</h1>
  <p class="book-subtitle" id="book-subtitle">Grail of Betrayal</p>
  <ol class="toc" id="toc-list" aria-label="Chapters"></ol>
</main>

<script src="js/app.js"></script>
</body>
</html>
